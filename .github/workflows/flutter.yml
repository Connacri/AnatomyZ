name: AnatomyZ CI & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "anatomyz-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  flutter-and-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify native Android host
        run: test -f android/app/build.gradle.kts

      # Generate only the missing Gradle wrapper, then restore the repository's
      # native Android host so Flutter cannot overwrite custom security code.
      - name: Bootstrap Gradle wrapper without replacing native host
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            tmpdir="$(mktemp -d)"
            flutter create --platforms=android .
            cp android/gradlew "$tmpdir/gradlew"
            cp android/gradlew.bat "$tmpdir/gradlew.bat"
            cp -R android/gradle/wrapper "$tmpdir/wrapper"
            git checkout -- android
            rm -f android/local.properties
            cp "$tmpdir/gradlew" android/gradlew
            cp "$tmpdir/gradlew.bat" android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp -f "$tmpdir/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
          EOF

      - name: Configure Android signing from GitHub Secrets
        run: |
          mkdir -p android/app/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystores/release.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystores/release.jks
          EOF
            echo "Signing keystore configured from GitHub Secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; using repository keystore configuration."
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build versioned Android APK & AAB
        run: |
          BUILD_NUM="${GITHUB_RUN_NUMBER:-1}"
          BUILD_NAME="1.0.${BUILD_NUM}"
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"

      - name: Prepare Android release binaries (APK & AAB)
        working-directory: .
        run: |
          BUILD_NUM="${GITHUB_RUN_NUMBER:-1}"
          VERSION_TAG="v1.0.${BUILD_NUM}"
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk flutter_app/build/app/outputs/flutter-apk/AnatomyZ-release.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk "flutter_app/build/app/outputs/flutter-apk/AnatomyZ-${VERSION_TAG}.apk"
          cp flutter_app/build/app/outputs/bundle/release/app-release.aab flutter_app/build/app/outputs/bundle/release/AnatomyZ-release.aab
          cp flutter_app/build/app/outputs/bundle/release/app-release.aab "flutter_app/build/app/outputs/bundle/release/AnatomyZ-${VERSION_TAG}.aab"

      - name: Build Web Application & bundle Android releases into site/
        working-directory: .
        run: |
          npm install
          npm run build
          mkdir -p site/releases
          cp flutter_app/build/app/outputs/flutter-apk/AnatomyZ-release.apk site/releases/AnatomyZ-release.apk
          cp flutter_app/build/app/outputs/bundle/release/AnatomyZ-release.aab site/releases/AnatomyZ-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: AnatomyZ-android-v1.0.${{ github.run_number }}
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/flutter-apk/AnatomyZ-release.apk
            flutter_app/build/app/outputs/flutter-apk/AnatomyZ-v*.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
            flutter_app/build/app/outputs/bundle/release/AnatomyZ-release.aab
            flutter_app/build/app/outputs/bundle/release/AnatomyZ-v*.aab

      - name: Publish Versioned APK and AAB to GitHub Releases on every push
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_NUM="${GITHUB_RUN_NUMBER:-1}"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          else
            VERSION_TAG="v1.0.${BUILD_NUM}"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          TITLE="AnatomyZ ${VERSION_TAG} (${SHORT_SHA})"
          NOTES="### AnatomyZ Release ${VERSION_TAG}
          - **Commit** : \`${GITHUB_SHA}\` (${COMMIT_MSG})
          - **Version Android** : \`1.0.${BUILD_NUM}+${BUILD_NUM}\`
          - **Binaires inclus** : APK Signé (\`AnatomyZ-release.apk\`, \`AnatomyZ-${VERSION_TAG}.apk\`) & Android App Bundle (\`AnatomyZ-release.aab\`, \`AnatomyZ-${VERSION_TAG}.aab\`)"

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" \
              flutter_app/build/app/outputs/flutter-apk/app-release.apk \
              flutter_app/build/app/outputs/flutter-apk/AnatomyZ-release.apk \
              "flutter_app/build/app/outputs/flutter-apk/AnatomyZ-${VERSION_TAG}.apk" \
              flutter_app/build/app/outputs/bundle/release/app-release.aab \
              flutter_app/build/app/outputs/bundle/release/AnatomyZ-release.aab \
              "flutter_app/build/app/outputs/bundle/release/AnatomyZ-${VERSION_TAG}.aab" \
              --clobber
            gh release edit "$VERSION_TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$VERSION_TAG" \
              flutter_app/build/app/outputs/flutter-apk/app-release.apk \
              flutter_app/build/app/outputs/flutter-apk/AnatomyZ-release.apk \
              "flutter_app/build/app/outputs/flutter-apk/AnatomyZ-${VERSION_TAG}.apk" \
              flutter_app/build/app/outputs/bundle/release/app-release.aab \
              flutter_app/build/app/outputs/bundle/release/AnatomyZ-release.aab \
              "flutter_app/build/app/outputs/bundle/release/AnatomyZ-${VERSION_TAG}.aab" \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
