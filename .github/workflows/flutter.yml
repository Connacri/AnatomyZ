name: AnatomyZ CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify native Android host
        run: test -f android/app/build.gradle.kts

      # Generate only the missing Gradle wrapper, then restore the repository's
      # native Android host so Flutter cannot overwrite custom security code.
      - name: Bootstrap Gradle wrapper without replacing native host
        run: |
          if [ ! -f android/gradlew ]; then
            tmpdir="$(mktemp -d)"
            flutter create --platforms=android .
            cp android/gradlew "$tmpdir/gradlew"
            cp android/gradlew.bat "$tmpdir/gradlew.bat"
            cp -R android/gradle "$tmpdir/gradle"
            git checkout -- android
            cp "$tmpdir/gradlew" android/gradlew
            cp "$tmpdir/gradlew.bat" android/gradlew.bat
            cp -R "$tmpdir/gradle" android/gradle
            chmod +x android/gradlew
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: AnatomyZ-android
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
