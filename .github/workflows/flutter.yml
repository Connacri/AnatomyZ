name: AnatomyZ CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify native Android host
        run: test -f android/app/build.gradle.kts

      # The repository keeps the native host under source control. This fallback
      # only restores Gradle wrapper files when they are absent in CI.
      - name: Bootstrap missing Flutter wrapper files
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android .
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: AnatomyZ-android
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/app/outputs/bundle/release/app-release.aab
