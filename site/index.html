<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnatomyZ — Atlas anatomique 3D</title>
  <meta name="description" content="AnatomyZ — atlas anatomique humain 3D basé sur un Knowledge Graph (FMA/UBERON), des modèles GLB/GLTF vérifiés et un espace pédagogique Professeur/Étudiant.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --surface: #0d1a2b;
      --surface-hover: #132640;
      --border: #203651;
      --border-accent: #2c4a70;
      --text: #eef4ff;
      --muted: #b8c7da;
      --subtle: #71839b;
      --accent: #8fc5ff;
      --primary: #4f46e5;
      --primary-hover: #6366f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header.appbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }
    .appbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .badge {
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid var(--border-accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }
    button, .btn {
      font: inherit;
      cursor: pointer;
      border-radius: 12px;
      border: 1px solid var(--border-accent);
      background: var(--surface);
      color: var(--text);
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    button:hover, .btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }
    button.primary {
      background: var(--primary);
      border-color: var(--primary-hover);
      color: #fff;
    }
    button.primary:hover {
      background: var(--primary-hover);
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    main.container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 20px 64px;
      flex: 1;
    }
    .card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      margin-bottom: 14px;
    }
    .role-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      text-align: left;
      padding: 22px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 12px;
    }
    .role-card:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin: 24px 0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0;
    }
    .stat-card {
      text-align: center;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .stat-value {
      font-size: 24px;
      font-weight: 800;
    }
    .stat-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    input, textarea, select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #060d18;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      margin-bottom: 10px;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .segmented {
      display: inline-flex;
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      padding: 3px;
      background: #060d18;
      gap: 4px;
    }
    .segmented button {
      border: none;
      padding: 6px 14px;
      border-radius: 9px;
      background: transparent;
      font-size: 13px;
    }
    .segmented button.active {
      background: var(--primary);
      color: #fff;
    }
    /* Atlas Layout */
    .atlas-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: calc(100vh - 61px);
      overflow: hidden;
    }
    @media (max-width: 820px) {
      .atlas-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
    }
    .atlas-drawer {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
    }
    .atlas-viewer {
      display: flex;
      flex-direction: column;
      background: #05080d;
      position: relative;
      min-height: 520px;
    }
    .viewer-toolbar {
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .canvas-wrap {
      flex: 1;
      position: relative;
      min-height: 440px;
    }
    .list-item {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .list-item.active {
      background: var(--primary);
      color: #fff;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      max-width: 540px;
      width: 100%;
      padding: 24px;
    }
    footer {
      margin-top: 40px;
      color: var(--subtle);
      text-align: center;
      font-size: 14px;
    }
    a { color: var(--accent); text-decoration: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.174.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.174.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <script type="module">

    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const BASE_MODELS = 'https://raw.githubusercontent.com/Connacri/Anatria-3D/main/public/anatomy';
    const SYSTEMS = [
      { id: 'skeletal', nameFr: 'Système squelettique', nameEn: 'Skeletal system', male: true, female: true },
      { id: 'muscular', nameFr: 'Système musculaire', nameEn: 'Muscular system', male: true, female: false },
      { id: 'articular', nameFr: 'Système articulaire', nameEn: 'Articular system', male: true, female: false },
      { id: 'cardiovascular', nameFr: 'Système cardiovasculaire', nameEn: 'Cardiovascular system', male: true, female: true },
      { id: 'nervous', nameFr: 'Système nerveux', nameEn: 'Nervous system', male: true, female: false },
      { id: 'respiratory', nameFr: 'Système respiratoire', nameEn: 'Respiratory system', male: true, female: false },
      { id: 'digestive', nameFr: 'Système digestif', nameEn: 'Digestive system', male: true, female: true },
      { id: 'endocrine', nameFr: 'Système endocrinien', nameEn: 'Endocrine system', male: true, female: false },
      { id: 'urinary', fileId: 'renal', nameFr: 'Système urinaire', nameEn: 'Urinary system', male: true, female: true },
      { id: 'reproductive', nameFr: 'Système reproducteur', nameEn: 'Reproductive system', male: true, female: true },
      { id: 'lymphatic', nameFr: 'Système lymphatique', nameEn: 'Lymphatic system', male: true, female: true },
      { id: 'integumentary', nameFr: 'Système tégumentaire', nameEn: 'Integumentary system', male: false, female: true },
      { id: 'visceral', nameFr: 'Anatomie viscérale', nameEn: 'Visceral anatomy', male: true, female: false },

    const SEED_CATALOG = [
      { id: 'FMA:55675', nameFr: 'Cœur', nameEn: 'Heart', system: 'cardiovascular', synonymsFr: ['coeur'], synonymsEn: [], source: 'FMA', meshAvailable: true, meshNode: 'Heart', meshFile: 'cardiovascular_male.glb' },
      { id: 'FMA:7196', nameFr: 'Poumon', nameEn: 'Lung', system: 'respiratory', synonymsFr: ['poumons'], synonymsEn: ['lungs'], source: 'FMA', meshAvailable: true, meshNode: 'Lung', meshFile: 'respiratory_male.glb' },
      { id: 'FMA:9668', nameFr: 'Foie', nameEn: 'Liver', system: 'digestive', synonymsFr: [], synonymsEn: [], source: 'FMA', meshAvailable: true, meshNode: 'Liver', meshFile: 'digestive_male.glb' },
      { id: 'FMA:5824', nameFr: 'Rein', nameEn: 'Kidney', system: 'urinary', synonymsFr: ['reins'], synonymsEn: [], source: 'FMA', meshAvailable: true, meshNode: 'Kidney', meshFile: 'renal_male.glb' },
      { id: 'FMA:7197', nameFr: 'Estomac', nameEn: 'Stomach', system: 'digestive', synonymsFr: [], synonymsEn: [], source: 'FMA', meshAvailable: true, meshNode: 'Stomach', meshFile: 'digestive_male.glb' },
      { id: 'FMA:7154', nameFr: 'Cerveau', nameEn: 'Brain', system: 'nervous', synonymsFr: ['encéphale'], synonymsEn: ['encephalon'], source: 'FMA', meshAvailable: true, meshNode: 'Brain', meshFile: 'nervous_male.glb' },
    ];

    const QUESTION_BANK = [
      {
        id: 'q-heart-basic',
        text: 'Quel organe propulse le sang dans la circulation ?',
        type: 'quiz',
        options: ['Le cœur', 'Le foie', 'Le rein', 'Le poumon'],

        points: 1,
      },
      {

    const state = {

      sex: 'male',

      selectedEntity: null,
      selectedStructure: null,
      structureSheet: null,
      structureRelations: [],

      exams: [

          questions: [

              type: 'quiz',
              options: ['Le cœur', 'Le foie', 'Le rein', 'Le poumon'],
              correctOptionIndex: 0,
              points: 1,
            },
          ],
        },
      ],
      assignments: [{ id: 'a1', examId: 'demo-cardiovascular', status: 'À faire' }],
      results: [],
      history: [],
      editorQuestions: [],
      editorType: 'quiz',
      activeExam: null,
      examAnswers: {},
      examCurrentIndex: 0,
      examRemainingSec: 1800,
    };

    let examTimer = null;
    let viewerControl = null;

    function normalize(v) {
      return (v || '')
        .toLowerCase()
        .replace(/[àáâäãå]/g, 'a')
        .replace(/[èéêë]/g, 'e')
        .replace(/[ìíîï]/g, 'i')
        .replace(/[òóôöõ]/g, 'o')
        .replace(/[ùúûü]/g, 'u')
        .replace(/ç/g, 'c')
        .replace(/œ/g, 'oe')
        .trim();
    }

    async function searchRemoteCatalog(query) {
      const q = normalize(query);
      if (q.length < 2) {
        state.remoteStructures = [];
        render();
        return;
      }
      try {
        const idxResp = await fetch('./catalog/index.json');
        if (!idxResp.ok) return;
        const idx = await idxResp.json();
        const prefixData = idx.prefixes && idx.prefixes[q[0]];
        if (!prefixData) return;
        const rows = [];
        for (const chunk of (prefixData.chunks || [])) {
          const r = await fetch('./catalog/' + chunk.file);
          if (!r.ok) continue;
          const txt = await r.text();
          for (const line of txt.split('\n')) {
            if (!line.trim()) continue;
            const item = JSON.parse(line);
            rows.push({
              id: item.id,
              nameFr: item.name_fr || item.name_en,
              nameEn: item.name_en,
              system: item.system,
              synonymsFr: item.synonyms_fr || [],
              synonymsEn: item.synonyms_en || [],
              source: item.source || 'AnatomyZ',
              meshAvailable: Boolean(item.mesh_available),
              meshVariants: item.mesh_variants || [],
            });
          }
        }
        state.remoteStructures = rows.filter((s) =>
          [s.id, s.nameFr, s.nameEn, ...s.synonymsFr, ...s.synonymsEn].some((val) =>
            normalize(val).includes(q)
          )
        ).slice(0, 40);
        render();
      } catch {
        // Offline or catalog not yet built
      }
    }

    function mount3DViewer(container, modelUrl) {
      if (!container) return;
      container.innerHTML = '';
      const width = container.clientWidth || 720;
      const height = container.clientHeight || 460;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06090e);
      const camera = new THREE.PerspectiveCamera(45, width / height, 0.05, 1000);
      camera.position.set(0, 0.7, 2.7);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xdbeafe, 1.3));
      const dirLight = new THREE.DirectionalLight(0xffffff, 2.1);
      dirLight.position.set(3, 5, 4);
      scene.add(dirLight);

      const meshesMap = new Map();
      const origMat = new Map();

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
      const loader = new GLTFLoader();
      loader.setDRACOLoader(dracoLoader);
      loader.load(
        modelUrl,
        (gltf) => {
          const root = gltf.scene;
          scene.add(root);
          const box = new THREE.Box3().setFromObject(root);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z) || 1;
          controls.target.copy(center);
          const fovRad = (camera.fov * Math.PI) / 180;
          const dist = (maxDim / (2 * Math.tan(fovRad / 2))) * 1.15;
          camera.position.set(center.x, center.y + maxDim * 0.05, center.z + dist);
          camera.updateProjectionMatrix();
          controls.update();
          root.traverse((c) => {
            if (c.isMesh) {
              const name = c.name || (c.parent && c.parent.name) || 'Structure';
              c.userData.anatomicalName = name;
              origMat.set(c.uuid, c.material.clone());
              const arr = meshesMap.get(name) || [];
              arr.push(c);
              meshesMap.set(name, arr);
            }
          });
        },
        undefined,
        (err) => {
          console.error('Erreur chargement GLB:', err);
        }
      );

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downX = 0, downY = 0;
      renderer.domElement.addEventListener('pointerdown', (e) => {
        downX = e.clientX;
        downY = e.clientY;
      });
      renderer.domElement.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const all = [];
        meshesMap.forEach((arr) => arr.forEach((m) => m.visible && all.push(m)));
        const hits = raycaster.intersectObjects(all, false);
        if (hits.length > 0) {
          const name = hits[0].object.userData.anatomicalName;
          state.selectedEntity = { id: name, name };
          const arr = meshesMap.get(name) || [];
          arr.forEach((m) => {
            m.material = new THREE.MeshStandardMaterial({ color: 0x26a6ff, roughness: 0.5 });
          });
          const statusEl = document.getElementById('entity-status');
          if (statusEl) statusEl.textContent = 'Structure sélectionnée : ' + name;
        }
      });

      viewerControl = {
        zoom: (factor) => {
          camera.position.multiplyScalar(1 / factor);
          controls.update();
        },
        reset: () => {
          meshesMap.forEach((arr) =>
            arr.forEach((m) => {
              if (origMat.get(m.uuid)) m.material = origMat.get(m.uuid);
              m.visible = true;
            })
          );
          state.selectedEntity = null;
          const statusEl = document.getElementById('entity-status');
          if (statusEl) {
            statusEl.textContent = 'Touchez une structure anatomique • pincez pour zoomer • glissez pour tourner/déplacer';
          }
        },
        hideSelected: () => {
          if (!state.selectedEntity) return;
          (meshesMap.get(state.selectedEntity.name) || []).forEach((m) => (m.visible = false));
        },
        showSelected: () => {
          if (!state.selectedEntity) return;
          (meshesMap.get(state.selectedEntity.name) || []).forEach((m) => (m.visible = true));
        },
        transparentSelected: () => {
          if (!state.selectedEntity) return;
          (meshesMap.get(state.selectedEntity.name) || []).forEach((m) => {
            m.material = new THREE.MeshStandardMaterial({
              color: 0x26a6ff,
              transparent: true,
              opacity: 0.35,
            });
          });
        },
      };

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (state.screen === 'role_selection') {
        app.innerHTML = `
          <header class="appbar">
            <div class="appbar-left">
              <span class="brand-title">AnatomyZ</span>
              <span class="badge">Human 3D Anatomy</span>
            </div>
            <button id="btn-direct-atlas">Explorer l’atlas 3D</button>
          </header>
          <main class="container">
            <span class="badge">AnatomyZ · Human 3D Anatomy</span>
            <h1 style="font-size:clamp(34px,6vw,58px);margin:18px 0 10px">Choisissez votre rôle</h1>
            <p style="color:var(--muted);font-size:17px;line-height:1.6;margin-bottom:28px">
              Un atlas anatomique humain 3D natif Flutter et Web, construit autour d'un
              Knowledge Graph anatomique, des ontologies FMA/UBERON et de modèles GLB/GLTF vérifiés progressivement.
            </p>
            <button class="role-card" id="role-prof">
              <div>
                <div style="font-size:20px;font-weight:700">🎓 Professeur</div>
                <div style="color:var(--muted);font-size:14px;margin-top:4px">Créer des quiz et des questions d’examen</div>
              </div>
              <span>→</span>
            </button>
            <button class="role-card" id="role-student">
              <div>
                <div style="font-size:20px;font-weight:700">👤 Étudiant</div>
                <div style="color:var(--muted);font-size:14px;margin-top:4px">Consulter les examens et les passer</div>
              </div>
              <span>→</span>
            </button>

            <div class="grid">
              <section class="card"><h2>🧠 Knowledge Graph</h2><p>Structures, synonymes et relations anatomiques.</p></section>
              <section class="card"><h2>🦴 3D Anatomy</h2><p>Modèles GLB/GLTF, sélection, visibilité et matériaux.</p></section>
              <section class="card"><h2>🔗 Mapping Engine</h2><p>Correspondances exactes, xrefs et mappings vérifiés.</p></section>
              <section class="card"><h2>🎓 Education</h2><p>Professeur, étudiant, quiz, questions et mode examen sécurisé.</p></section>
            </div>
            <p><a href="./catalog/index.json">→ Catalogue anatomique JSON</a> · <a href="https://github.com/Connacri/AnatomyZ">→ Dépôt GitHub</a></p>
            <footer>Projet académique — Professeur Zenasni Kamel</footer>
          </main>
        `;
        document.getElementById('role-prof').onclick = () => { state.role = 'professor'; state.screen = 'role_home'; render(); };
        document.getElementById('role-student').onclick = () => { state.role = 'student'; state.screen = 'role_home'; render(); };
        document.getElementById('btn-direct-atlas').onclick = () => { state.screen = 'anatomy_home'; render(); };
        return;
      }

      if (state.screen === 'role_home') {
        const isProf = state.role === 'professor';
        const labelFr = isProf ? 'Professeur' : 'Étudiant';
        app.innerHTML = `
          <header class="appbar">
            <div class="appbar-left">
              <button id="back-btn">← Retour</button>
              <span class="brand-title">AnatomyZ — ${labelFr}</span>
            </div>
          </header>
          <main class="container">
            <div class="card">
              <h2 style="margin:0 0 6px">${labelFr}</h2>
              <p style="margin:0;color:var(--muted)">${isProf ? 'Créer et gérer des examens' : 'Passer les examens assignés'}</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px">
              <button class="primary" id="btn-dashboard">${isProf ? 'Espace professeur' : 'Mon espace étudiant'}</button>
              ${isProf
                ? `<button class="primary" id="btn-create-exam">Créer un examen</button>
                   <button id="btn-my-exams">Mes examens</button>`
                : `<button class="primary" id="btn-student-exams">Examens disponibles</button>`}
              <button id="btn-atlas">Explorer l’atlas anatomique</button>
            </div>
          </main>
        `;
        document.getElementById('back-btn').onclick = () => { state.screen = 'role_selection'; render(); };
        document.getElementById('btn-dashboard').onclick = () => { state.screen = 'academic_dashboard'; render(); };
        document.getElementById('btn-atlas').onclick = () => { state.screen = 'anatomy_home'; render(); };
        if (isProf) {
          document.getElementById('btn-create-exam').onclick = () => { state.screen = 'professor_exam_editor'; render(); };
          document.getElementById('btn-my-exams').onclick = () => { state.screen = 'professor_exam_editor'; render(); };
        } else {
          document.getElementById('btn-student-exams').onclick = () => { state.screen = 'student_exam_list'; render(); };
        }
        return;
      }

      if (state.screen === 'academic_dashboard') {
        const isProf = state.role === 'professor';
        app.innerHTML = `
          <header class="appbar">
            <div class="appbar-left">
              <button id="back-btn">← Retour</button>
              <span class="brand-title">${isProf ? 'Espace professeur' : 'Espace étudiant'}</span>
            </div>
          </header>
          <main class="container">
            ${isProf ? `
              <h2>Pilotage pédagogique</h2>
              <p style="color:var(--muted)">Classes, étudiants, examens assignés et résultats réunis au même endroit.</p>
              <div class="stats-grid">
                <div class="stat-card"><div class="stat-value">${state.classes.length}</div><div class="stat-label">Classes</div></div>
                <div class="stat-card"><div class="stat-value">1</div><div class="stat-label">Étudiants</div></div>
                <div class="stat-card"><div class="stat-value">${state.exams.length}</div><div class="stat-label">Examens</div></div>
              </div>
              <div class="card">
                <h3>Mes classes</h3>
                ${state.classes.map(c => `<div><strong>${c.name}</strong> — ${c.studentsCount} étudiant(s)</div>`).join('')}
              </div>
              <div class="card">
                <h3>Examens</h3>
                ${state.exams.map(e => `<div><strong>${e.title}</strong> — ${e.questions.length} question(s) · ${e.durationMinutes} min</div>`).join('')}
              </div>
              <div class="card">
                <h3>Fonctions pédagogiques</h3>
                <p style="color:var(--muted);margin:0">Banque de questions · assignation par classe · calendrier · notes · statistiques · correction · export · parcours pédagogiques.</p>
              </div>
            ` : `
              <h2>Mon espace</h2>
              <p style="color:var(--muted)">Examens assignés, résultats, notes et historique d’apprentissage.</p>
              <div class="stats-grid">
                <div class="stat-card"><div class="stat-value">${state.assignments.length}</div><div class="stat-label">Assignés</div></div>
                <div class="stat-card"><div class="stat-value">${state.results.length}</div><div class="stat-label">Résultats</div></div>
                <div class="stat-card"><div class="stat-value">${state.history.length}</div><div class="stat-label">Activités</div></div>
              </div>
              <div class="card">
                <h3>Examens assignés</h3>
                ${state.assignments.map(a => `<div>Examen ${a.examId} — ${a.status}</div>`).join('')}
              </div>
              <div class="card">
                <h3>Résultats et notes</h3>
                ${state.results.length === 0 ? '<p style="color:var(--muted)">Aucun résultat disponible.</p>' : state.results.map(r => `<div>Examen ${r.examId} : ${r.score}/${r.maxScore}</div>`).join('')}
              </div>
            `}
          </main>
        `;
        document.getElementById('back-btn').onclick = () => { state.screen = 'role_home'; render(); };
        return;
      }

      if (state.screen === 'professor_exam_editor') {
        app.innerHTML = `
          <header class="appbar">
            <div class="appbar-left">
              <button id="back-btn">← Retour</button>
              <span class="brand-title">Créateur d’examen</span>
            </div>
          </header>
          <main class="container">
            <div class="card">
              <input id="exam-title" placeholder="Titre de l’examen" />
              <input id="exam-desc" placeholder="Description" />
              <textarea id="q-text" rows="3" placeholder="Question"></textarea>
              <input id="q-opts" placeholder="Choix séparés par ; (ex: Le cœur; Le foie; Le rein)" />
              <button id="btn-add-q">+ Ajouter la question</button>
            </div>
            <div class="card">
              <h3>Banque de questions (FMA/UBERON)</h3>
              ${QUESTION_BANK.map((q, i) => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
                  <div><strong>${q.text}</strong><div style="font-size:12px;color:var(--accent)">${q.conceptNameFr} • ${q.conceptId}</div></div>
                  <button class="bank-add" data-idx="${i}">+ Ajouter</button>
                </div>
              `).join('')}
            </div>
            <div class="card">
              <h3>Questions de l’examen (${state.editorQuestions.length})</h3>
              ${state.editorQuestions.map((q, i) => `<div>${i + 1}. ${q.text}</div>`).join('')}
              ${state.editorQuestions.length > 0 ? `<button class="primary" id="btn-save-exam" style="margin-top:12px;width:100%">🔒 Publier l’examen sécurisé</button>` : ''}
            </div>
          </main>
        `;
        document.getElementById('back-btn').onclick = () => { state.screen = 'role_home'; render(); };
        document.getElementById('btn-add-q').onclick = () => {
          const text = document.getElementById('q-text').value.trim();
          const opts = document.getElementById('q-opts').value.split(';').map(s => s.trim()).filter(Boolean);
          if (!text || opts.length < 2) return;
          state.editorQuestions.push({ id: 'q' + (state.editorQuestions.length + 1), text, type: 'quiz', options: opts, correctOptionIndex: 0, points: 1 });
          render();
        };
        document.querySelectorAll('.bank-add').forEach(btn => {
          btn.onclick = () => {
            state.editorQuestions.push(QUESTION_BANK[Number(btn.dataset.idx)]);
            render();
          };
        });
        const saveBtn = document.getElementById('btn-save-exam');
        if (saveBtn) {
          saveBtn.onclick = () => {
            const title = document.getElementById('exam-title').value.trim() || 'Nouvel examen AnatomyZ';
            state.exams.push({ id: 'exam-' + Date.now(), title, description: '', durationMinutes: 30, questions: [...state.editorQuestions] });
            state.editorQuestions = [];
            state.screen = 'role_home';
            render();
          };
        }
        return;
      }

      if (state.screen === 'student_exam_list') {
        app.innerHTML = `
          <header class="appbar">
            <div class="appbar-left">
              <button id="back-btn">← Retour</button>
              <span class="brand-title">Examens disponibles</span>
            </div>
          </header>
          <main class="container">
            ${state.exams.map((e, idx) => `
              <button class="role-card start-exam" data-idx="${idx}">
                <div>
                  <div style="font-weight:700">${e.title}</div>
                  <div style="font-size:13px;color:var(--muted)">${e.questions.length} question(s) • ${e.durationMinutes} min</div>
                </div>
                <span>→</span>
              </button>
            `).join('')}
          </main>
        `;
        document.getElementById('back-btn').onclick = () => { state.screen = 'role_home'; render(); };
        document.querySelectorAll('.start-exam').forEach(btn => {
          btn.onclick = () => {
            state.activeExam = state.exams[Number(btn.dataset.idx)];
            state.examAnswers = {};
            state.examCurrentIndex = 0;
            state.screen = 'student_exam';
            render();
          };
        });
        return;
      }

      if (state.screen === 'student_exam') {
        const exam = state.activeExam;
        const q = exam.questions[state.examCurrentIndex];
        app.innerHTML = `
          <header class="appbar">
            <div class="appbar-left">
              <span class="brand-title">🔒 ${exam.title}</span>
            </div>
            <span class="badge">Mode examen sécurisé</span>
          </header>
          <main class="container">
            <div class="card">
              <strong>Mode examen sécurisé</strong> — L’atlas anatomique est masqué pendant cette épreuve.
            </div>
            <div class="card">
              <div style="color:var(--accent);font-size:13px;margin-bottom:8px">Question ${state.examCurrentIndex + 1} / ${exam.questions.length}</div>
              <h2 style="margin-top:0">${q.text}</h2>
              ${(q.options || []).map(opt => `
                <label style="display:block;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer">
                  <input type="radio" name="ans" value="${opt}" style="width:auto;margin-right:8px" ${state.examAnswers[q.id] === opt ? 'checked' : ''}/>
                  ${opt}
                </label>
              `).join('')}
              <button class="primary" id="next-q" style="width:100%;margin-top:12px">
                ${state.examCurrentIndex + 1 < exam.questions.length ? 'Question suivante' : 'Terminer l’examen'}
              </button>
            </div>
          </main>
        `;
        document.querySelectorAll('input[name="ans"]').forEach(inp => {
          inp.onchange = (e) => { state.examAnswers[q.id] = e.target.value; };
        });
        document.getElementById('next-q').onclick = () => {
          if (state.examCurrentIndex + 1 < exam.questions.length) {
            state.examCurrentIndex++;
            render();
          } else {
            let score = 0;
            exam.questions.forEach(quest => {
              if (quest.options && quest.options.indexOf(state.examAnswers[quest.id]) === quest.correctOptionIndex) {
                score += quest.points || 1;
              }
            });
            state.results.push({ examId: exam.id, score, maxScore: exam.questions.length });
            state.screen = 'student_exam_list';
            render();
          }
        };
        return;
      }

      if (state.screen === 'anatomy_home') {
        const localMatches = SEED_CATALOG.filter(s => {
          const q = normalize(state.structureSearch);
          return !q || [s.id, s.nameFr, s.nameEn, ...s.synonymsFr].some(v => normalize(v).includes(q));
        });
        const mergedStructures = [...localMatches, ...state.remoteStructures].slice(0, 40);
        const sys = state.selectedSystem;
        const fileId = sys ? (sys.fileId || sys.id) : 'cardiovascular';
        const modelUrl = `${BASE_MODELS}/${fileId}_${state.sex}.glb`;

        app.innerHTML = `
          <header class="appbar">
            <div class="appbar-left">
              <button id="back-btn">← Retour</button>
              <span class="brand-title">AnatomyZ — Atlas 3D</span>
            </div>
            <div class="segmented">
              <button id="sex-m" class="${state.sex === 'male' ? 'active' : ''}">♂ Homme</button>
              <button id="sex-f" class="${state.sex === 'female' ? 'active' : ''}">♀ Femme</button>
            </div>
          </header>
          <div class="atlas-layout">
            <aside class="atlas-drawer">
              <input id="sys-search" placeholder="Rechercher un système…" value="${state.systemSearch}" />
              <input id="struct-search" placeholder="Rechercher une structure (FR / EN / ID)…" value="${state.structureSearch}" />
              <div style="font-size:12px;font-weight:700;color:var(--accent);margin:8px 0">STRUCTURES (${mergedStructures.length})</div>
              <div style="max-height:170px;overflow-y:auto;margin-bottom:14px">
                ${mergedStructures.map(s => `
                  <button class="list-item struct-btn" data-id="${s.id}">
                    <span><strong>${s.nameFr}</strong> <small style="color:var(--subtle)">${s.nameEn} • ${s.id}</small></span>
                    <span class="badge">${s.meshAvailable ? '3D' : 'Cat.'}</span>
                  </button>
                `).join('')}
              </div>
              <div style="font-size:12px;font-weight:700;color:var(--accent);margin:8px 0">SYSTÈMES ANATOMIQUES 3D</div>
              ${SYSTEMS.filter(s => !state.systemSearch || normalize(s.nameFr + ' ' + s.nameEn).includes(normalize(state.systemSearch))).map(s => {
                const avail = state.sex === 'male' ? s.male : s.female;
                const active = sys && sys.id === s.id;
                return `
                  <button class="list-item sys-btn ${active ? 'active' : ''}" data-id="${s.id}" ${!avail ? 'disabled' : ''}>
                    <div>
                      <div style="font-weight:600">${s.nameFr}</div>
                      <div style="font-size:12px;color:${active ? '#e0e7ff' : 'var(--subtle)'}">${avail ? s.nameEn : s.nameEn + ' • 3D asset unavailable'}</div>
                    </div>
                  </button>
                `;
              }).join('')}
            </aside>
            <section class="atlas-viewer">
              <div class="viewer-toolbar">
                <div>
                  <strong>${sys ? sys.nameFr : ''}</strong>
                  <span style="color:var(--accent);font-size:13px;margin-left:8px">${sys ? sys.nameEn : ''} • ${state.sex === 'male' ? 'Male' : 'Female'}</span>
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                  <button id="z-out">Zoom -</button>
                  <button id="z-in">Zoom +</button>
                  <button id="v-hide">Masquer</button>
                  <button id="v-show">Afficher</button>
                  <button id="v-trans">Transparence</button>
                  <button id="v-reset">Réinitialiser</button>
                </div>
              </div>
              <div id="three-canvas" class="canvas-wrap"></div>
              <div id="entity-status" style="padding:10px;text-align:center;font-size:13px;background:var(--surface);border-top:1px solid var(--border)">
                Touchez une structure anatomique • pincez pour zoomer • glissez pour tourner/déplacer
              </div>
            </section>
          </div>
        `;

        document.getElementById('back-btn').onclick = () => { state.screen = 'role_selection'; render(); };
        document.getElementById('sex-m').onclick = () => { state.sex = 'male'; render(); };
        document.getElementById('sex-f').onclick = () => {
          state.sex = 'female';
          if (state.selectedSystem && !state.selectedSystem.female) {
            state.selectedSystem = SYSTEMS.find(s => s.female);
          }
          render();
        };
        document.getElementById('sys-search').oninput = (e) => { state.systemSearch = e.target.value; render(); };
        document.getElementById('struct-search').oninput = (e) => {
          state.structureSearch = e.target.value;
          searchRemoteCatalog(e.target.value);
        };
        document.querySelectorAll('.sys-btn').forEach(btn => {
          btn.onclick = () => {
            state.selectedSystem = SYSTEMS.find(s => s.id === btn.dataset.id);
            render();
          };
        });
        document.getElementById('z-out').onclick = () => viewerControl && viewerControl.zoom(0.85);
        document.getElementById('z-in').onclick = () => viewerControl && viewerControl.zoom(1.35);
        document.getElementById('v-hide').onclick = () => viewerControl && viewerControl.hideSelected();
        document.getElementById('v-show').onclick = () => viewerControl && viewerControl.showSelected();
        document.getElementById('v-trans').onclick = () => viewerControl && viewerControl.transparentSelected();
        document.getElementById('v-reset').onclick = () => viewerControl && viewerControl.reset();

        mount3DViewer(document.getElementById('three-canvas'), modelUrl);
      }
    }

    render();
  </script>
</body>
</html>
